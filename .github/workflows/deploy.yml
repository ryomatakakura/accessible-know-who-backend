name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password-only
          MYSQL_DATABASE: seats
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest-password-only" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Test (SQLite)
        run: pytest -q
      - name: Test (MySQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: mysql+pymysql://root:test-password-only@127.0.0.1:3306/seats?charset=utf8mb4
          DB_SSL: disable

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # GitHub の環境設定で承認者を付けられる
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: zip -qr api.zip app requirements.txt -x "*/__pycache__/*"
      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}   # Azure ポータルの「発行プロファイルのダウンロード」の中身
          package: api.zip
